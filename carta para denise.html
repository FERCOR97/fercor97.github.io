<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&display=swap');

  :root{
    --espresso:#241511;
    --paper:#f3e6cb;
    --paper-dark:#e8d5aa;
    --brass:#c79a56;
    --brass-light:#e8c179;
    --amber:#ff9d4d;
    --wine:#7c2b2b;
    --wine-light:#a63d3d;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,157,77,0.10), transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(255,120,60,0.08), transparent 55%),
      var(--espresso);
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(255,157,77,0.10), transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(255,120,60,0.08), transparent 55%),
      repeating-linear-gradient(0deg, #2a1a14 0 22px, #251510 22px 24px),
      repeating-linear-gradient(90deg, #2a1a14 0 44px, #221208 44px 46px);
    font-family:'Cormorant Garamond', serif;
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
    overflow-x:hidden;
  }

  .flicker{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, rgba(255,180,90,0.06), transparent 60%);
    animation:flick 6s ease-in-out infinite;
    mix-blend-mode:screen;
  }
  @keyframes flick{
    0%,100%{opacity:.6;}
    45%{opacity:1;}
    50%{opacity:.5;}
    72%{opacity:.9;}
  }

  .stage{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  .eyebrow{
    font-family:'Cinzel', serif;
    letter-spacing:.35em;
    font-size:11px;
    color:var(--brass-light);
    text-transform:uppercase;
    opacity:.85;
    text-align:center;
  }

  .counter{
    display:flex;
    gap:7px;
    margin-bottom:2px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(232,213,170,0.18);
    border:1px solid rgba(232,213,170,0.25);
    transition:all .4s ease;
  }
  .dot.done{
    background:var(--amber);
    border-color:var(--amber);
    box-shadow:0 0 8px rgba(255,157,77,.8);
  }

  /* ---- Frame: ornate oval mirror motif ---- */
  .frame-wrap{
    position:relative;
    width:100%;
  }

  .ornate{
    position:relative;
    width:100%;
    min-height:540px;
    border-radius:50% 50% 46% 46% / 60% 60% 40% 40%;
    background:
      linear-gradient(180deg, var(--paper) 0%, var(--paper-dark) 100%);
    border:10px solid transparent;
    background-clip:padding-box;
    box-shadow:
      0 0 0 3px rgba(199,154,86,.9),
      0 0 0 6px rgba(36,21,17,.9),
      0 0 0 9px rgba(199,154,86,.55),
      0 25px 60px rgba(0,0,0,.55),
      inset 0 0 40px rgba(124,43,43,.06);
    padding:60px 48px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    color:var(--espresso);
    animation:reveal .7s cubic-bezier(.2,.8,.2,1);
  }

  .ornate::before{
    content:'';
    position:absolute;
    top:-26px;left:50%;
    transform:translateX(-50%);
    width:64px;height:34px;
    background:
      radial-gradient(circle at 50% 100%, var(--brass-light) 0 40%, transparent 41%),
      linear-gradient(180deg, var(--brass) , #8a6a35);
    border-radius:50% 50% 10% 10%;
    box-shadow:0 0 0 3px rgba(36,21,17,.9);
  }

  @keyframes reveal{
    from{opacity:0; transform:translateY(14px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .num{
    font-family:'Cinzel', serif;
    font-size:13px;
    letter-spacing:.28em;
    color:var(--wine);
    margin-bottom:6px;
  }

  h1{
    font-family:'Cinzel', serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:.03em;
    margin:0 0 18px;
    color:var(--espresso);
  }

  .prompt{
    font-size:25px;
    line-height:1.5;
    font-style:italic;
    max-width:440px;
    margin:0 0 20px;
  }

  input[type=text]{
    width:100%;
    max-width:300px;
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    text-align:center;
    padding:10px 12px;
    border:none;
    border-bottom:2px solid var(--wine);
    background:transparent;
    color:var(--espresso);
    outline:none;
    margin-bottom:6px;
  }
  input[type=text]::placeholder{color:rgba(36,21,17,.35);}

  textarea{
    width:100%;
    max-width:340px;
    font-family:'Cormorant Garamond', serif;
    font-size:19px;
    text-align:center;
    padding:10px 12px;
    border:none;
    border-bottom:2px solid var(--wine);
    background:transparent;
    color:var(--espresso);
    outline:none;
    resize:none;
    min-height:44px;
  }

  .hint{
    font-size:14px;
    color:var(--wine-light);
    min-height:18px;
    margin-top:4px;
    font-style:italic;
  }

  .opts{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:340px;
    margin:0 auto;
  }
  .opt-btn{
    font-family:'Cormorant Garamond', serif;
    font-size:21px;
    padding:14px 18px;
    border:1.5px solid var(--wine);
    background:transparent;
    color:var(--espresso);
    border-radius:3px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .opt-btn:hover:not(:disabled){
    background:rgba(124,43,43,.08);
    transform:translateY(-1px);
  }
  .opt-btn:disabled{cursor:default;}
  .opt-correct{
    background:var(--wine) !important;
    color:var(--paper) !important;
    border-color:var(--wine) !important;
  }
  .opt-wrong{
    opacity:.4;
    text-decoration:line-through;
  }

  button.action{
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    background:var(--wine);
    color:var(--paper);
    border:none;
    padding:12px 26px;
    border-radius:2px;
    cursor:pointer;
    margin-top:16px;
    transition:all .25s ease;
    box-shadow:0 4px 14px rgba(124,43,43,.4);
  }
  button.action:hover{background:var(--wine-light); transform:translateY(-1px);}
  button.action:active{transform:translateY(0);}

  /* ---- Sealed envelope state ---- */
  .seal-card{
    position:relative;
    width:100%;
    max-width:440px;
    aspect-ratio:3/2;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-dark) 100%);
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), 0 0 0 1px rgba(199,154,86,.5);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:reveal .5s ease;
    transition:transform .2s ease;
  }
  .seal-card:hover{transform:translateY(-3px) scale(1.01);}
  .seal-card::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(135deg, transparent 49%, rgba(36,21,17,.13) 49.5%, rgba(36,21,17,.13) 50.5%, transparent 51%),
      linear-gradient(45deg, transparent 49%, rgba(36,21,17,.13) 49.5%, rgba(36,21,17,.13) 50.5%, transparent 51%);
    border-radius:6px;
  }
  .wax{
    width:76px;height:76px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wine-light), var(--wine) 60%, #4d1a1a 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel', serif;
    font-size:26px;
    color:var(--paper);
    box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.3);
    position:relative;
    z-index:1;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.3), 0 0 0 0 rgba(255,157,77,0);}
    50%{box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.3), 0 0 18px 4px rgba(255,157,77,.35);}
  }
  .seal-label{
    position:absolute;
    bottom:14px;
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:.25em;
    color:rgba(36,21,17,.55);
    text-transform:uppercase;
  }

  /* ---- Finale ---- */
  .photo-frame{
    width:100%;
    max-width:360px;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 6px var(--paper), 0 0 0 8px var(--brass);
    margin-bottom:18px;
  }
  .photo-frame img{
    width:100%;display:block;
  }

  .teamo{
    font-family:'Cinzel', serif;
    font-size:46px;
    color:var(--wine);
    letter-spacing:.05em;
    margin:6px 0 4px;
    animation:beat 1.8s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }

  .heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    color:var(--wine);
    opacity:.85;
    pointer-events:none;
    animation:rise linear forwards;
  }
  @keyframes rise{
    to{ transform:translateY(-100vh) rotate(30deg); opacity:0; }
  }

  @media (max-width:480px){
    .ornate{padding:44px 22px 34px; min-height:440px;}
    h1{font-size:21px;}
    .prompt{font-size:21px;}
    .teamo{font-size:36px;}
  }
</style>
</head>
<body>
<div class="flicker"></div>
<div class="stage">
  <div class="eyebrow">para Denise</div>
  <div class="counter" id="counter"></div>
  <div class="frame-wrap" id="app"></div>
</div>

<script>
const TOTAL = 10;
let current = 0; // index of next card to reveal, 0-9
let opened = false; // whether current card's seal has been broken

const letters = [
  {
    type:'trivia',
    q:'¿De qué color era el hoodie que te presté cuando fuimos de hiking?',
    options:['Gris','Azul','Negro'],
    correct:'Azul',
    success:'Exacto — te quedaba mejor a ti que a mí.'
  },
  {
    type:'trivia',
    q:'¿Cuál es la capital de Grecia?',
    options:['Roma','Madrid','Atenas'],
    correct:'Atenas',
    success:'Correcto. Algún día vamos juntos.'
  },
  {
    type:'trivia',
    q:'¿En qué lugar de la barra estábamos cuando nos hicimos novios?',
    options:['Attaboy','Penrose','The Django'],
    correct:'Penrose',
    success:'Penrose. Ese lugar ya tiene nombre propio en nuestra historia.'
  },
  {
    type:'trivia',
    q:'¿Cuál es el séptimo planeta del sistema solar?',
    options:['Neptuno','Saturno','Urano'],
    correct:'Urano',
    success:'Así es — Urano.'
  },
  {
    type:'trivia',
    q:'¿Quién es el mejor jugador en la historia del fútbol?',
    options:['Ronaldo','Maradona','Messi'],
    correct:'Messi',
    success:'La única respuesta correcta.'
  },
  {
    type:'static',
    title:'Dato curioso del amor',
    text:'¿Sabías esto? Algunos pingüinos buscan entre miles de piedras la más perfecta y se la regalan a la pingüina que les gusta. Si ella la acepta, se quedan juntos. Considera esta carta mi piedrita.'
  },
  {
    type:'open',
    title:'Si fueras un color',
    prompt:'¿Si fueras un color, cuál serías? Contesta tú.',
    placeholder:'Yo sería...'
  },
  {
    type:'static',
    text:'Aquí no se me ocurrió nada lol'
  },
  {
    type:'static',
    text:'Me encanta tu cuerpo.'
  },
  {
    type:'finale'
  }
];

function renderCounter(){
  const c = document.getElementById('counter');
  c.innerHTML = '';
  for(let i=0;i<TOTAL;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < current || (i===current && opened && i===TOTAL-1) ? ' done' : '');
    c.appendChild(d);
  }
}

function spawnHearts(n){
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const h = document.createElement('div');
      h.className='heart';
      h.textContent = ['♥','❤','♡'][Math.floor(Math.random()*3)];
      h.style.left = (Math.random()*90+5)+'vw';
      h.style.animationDuration = (3+Math.random()*2)+'s';
      h.style.fontSize = (14+Math.random()*16)+'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 6000);
    }, i*180);
  }
}

function renderSealed(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="seal-card" onclick="breakSeal()">
      <div class="wax">${current+1}</div>
      <div class="seal-label">Toca para abrir</div>
    </div>
  `;
}

function breakSeal(){
  opened = true;
  renderCurrent();
}

function goNext(){
  current++;
  opened = false;
  if(current >= TOTAL){
    return;
  }
  renderCounter();
  renderSealed();
}

function renderCurrent(){
  renderCounter();
  const item = letters[current];
  const app = document.getElementById('app');

  if(item.type === 'trivia'){
    const optsHtml = item.options.map(opt =>
      `<button class="opt-btn" data-opt="${opt}" onclick="checkAnswer(this)">${opt}</button>`
    ).join('');
    app.innerHTML = `
      <div class="ornate">
        <div class="num">CARTA ${current+1} DE ${TOTAL}</div>
        <h1>Trivia solo nuestra</h1>
        <p class="prompt">${item.q}</p>
        <div class="opts">${optsHtml}</div>
        <div class="hint" id="hint">&nbsp;</div>
      </div>
    `;
  }

  if(item.type === 'open'){
    app.innerHTML = `
      <div class="ornate">
        <div class="num">CARTA ${current+1} DE ${TOTAL}</div>
        <h1>${item.title}</h1>
        <p class="prompt">${item.prompt}</p>
        <textarea id="freeans" placeholder="${item.placeholder}"></textarea>
        <div><button class="action" onclick="goNext()">Listo</button></div>
      </div>
    `;
  }

  if(item.type === 'static'){
    app.innerHTML = `
      <div class="ornate">
        <div class="num">CARTA ${current+1} DE ${TOTAL}</div>
        ${item.title ? `<h1>${item.title}</h1>` : ''}
        <p class="prompt" style="font-size:${item.title ? '20px' : '24px'}; margin-top:${item.title ? '0' : '30px'};">${item.text}</p>
        <button class="action" onclick="goNext()">Siguiente</button>
      </div>
    `;
  }

  if(item.type === 'finale'){
    app.innerHTML = `
      <div class="ornate">

function checkAnswer(btn){
  const item = letters[current];
  const hint = document.getElementById('hint');
  const allBtns = document.querySelectorAll('.opt-btn');
  const picked = btn.dataset.opt;

  if(picked === item.correct){
    allBtns.forEach(b => b.disabled = true);
    btn.classList.add('opt-correct');
    hint.style.color = '#2e5c2e';
    hint.textContent = item.success;
    setTimeout(goNext, 1000);
  } else {
    btn.classList.add('opt-wrong');
    btn.disabled = true;
    hint.style.color = '';
    hint.textContent = 'No es esa... intenta de nuevo ✧';
  }
}

renderSealed();
